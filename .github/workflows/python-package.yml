# This workflow will install Python dependencies, run tests and lint with a variety of Python versions

name: CI tests

on:
  workflow_dispatch:
  push:
    branches: 
      - '*' # run on all
  pull_request:
    branches: 
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the whole matrix if one Python version fails — we want to
      # see which versions break.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    name: Python ${{ matrix.python-version }} tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SEAWRD and dependencies
        # Pulls pytest from [project.optional-dependencies].test in pyproject.toml
        # and installs SEAWRD itself (editable) so the tests can import it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run tests with pytest
        run: |
          python -m pytest --cov=seawrd -v

      - name: Generate lcov coverage report
        # The Coveralls action reads an lcov file; pytest-cov only writes the binary .coverage database and a
        # terminal summary, so we convert it explicitly. Only needed on the one leg that uploads to Coveralls.
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          python -m coverage lcov -o coverage.lcov

      - name: Coveralls GitHub Action
        if: ${{ matrix.python-version == '3.10' }}
        uses: coverallsapp/github-action@v2
        env:
          # Required until the Coveralls GitHub App integration is installed on this repo (see coveralls.io repo
          # settings); the repo token there works regardless of App installation. Add it as a repo secret in
          # GitHub: Settings -> Secrets and variables -> Actions -> New repository secret -> COVERALLS_REPO_TOKEN.
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage.lcov
          format: lcov