[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seawrd"
version = "0.5.0"
dependencies = [
    "keras",
    "tensorflow",
    "tensorflow_docs",
    "numpy",
    "pandas",
    "tomli",
    "tomli_w",
    "matplotlib",
    "pytest",
    "pytest-cov",
    "ipykernel"
]
authors = [
  {name = "Ashley Parr", email = "amparr83@gmail.com"},
  {name = "Bishwash Devkota", email = "bishwashdevkota567@gmail.com"},
  {name = "Fredi Quispe Huaynasi", email = "fredifqh@gmail.com"},
  {name = "Ian Rain-Water", email = "irainw@stanford.edu"},
  {name = "Artem Aguichine"},
  {name = "Anne Dattilo"},
  {name = "Hailey Feller"}
]
description = "Surrogate Emulator for Aquatic World Radius Determination"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]

[project.urls]
Repository = "https://github.com/Siphlygon/SEAWRD"

[tool.setuptools.packages.find]
where = ["."]
include = ["seawrd*"]
exclude = ["models*", "docs*", "tests*"]
namespaces = false

[tool.setuptools.package-data]
seawrd = ["*.toml", "*.dat"]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that train or save/load real TensorFlow models",
  "tf: tests requiring TensorFlow/Keras execution",
]
